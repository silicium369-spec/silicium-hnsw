float:
  any:
  - base_args: ['@metric']
    constructor: SiliciumHNSW
    disabled: false
    docker_tag: ann-benchmarks-silicium
    module: ann_benchmarks.algorithms.silicium
    name: silicium
    run_groups:
      M-8:
        arg_groups: [{M: 8, efConstruction: 100}]
        args: {}
        query_args: [[8, 12, 16, 24, 32, 48]]
      M-16:
        arg_groups: [{M: 16, efConstruction: 100, preset: fast_stream}]
        args: {}
        query_args: [[8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256]]
      M-24:
        arg_groups: [{M: 24, efConstruction: 160, preset: balanced}]
        args: {}
        query_args: [[16, 24, 32, 48, 64, 96, 128, 192, 256]]
      M-32:
        arg_groups: [{M: 32, efConstruction: 300, preset: high_fidelity}]
        args: {}
        query_args: [[16, 24, 32, 48, 64, 96, 128, 192, 256, 400]]
      M-64:
        arg_groups: [{M: 64, efConstruction: 500}]
        args: {}
        query_args: [[20, 50, 100, 200, 500, 1000]]
